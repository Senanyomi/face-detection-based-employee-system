version: "3.9"

# Run all 5 microservices locally with a single command:
#   docker-compose up --build
#
# Each service mounts the project root so the shared/ package is importable.
# Copy .env.example to .env and fill in your values before running.

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  volumes:
    - .:/app
  restart: unless-stopped

services:
  auth_service:
    <<: *common
    command: uvicorn auth_service.main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"

  attendance_service:
    <<: *common
    command: uvicorn attendance_service.main:app --host 0.0.0.0 --port 8002 --reload
    ports:
      - "8002:8002"

  analytics_service:
    <<: *common
    command: sh -c "python scripts/run_migrations.py && uvicorn analytics_service.main:app --host 0.0.0.0 --port 8003 --reload"
    ports:
      - "8003:8003"

  device_service:
    <<: *common
    command: uvicorn device_service.main:app --host 0.0.0.0 --port 8004 --reload
    ports:
      - "8004:8004"

  audit_service:
    <<: *common
    command: uvicorn audit_service.main:app --host 0.0.0.0 --port 8005 --reload
    ports:
      - "8005:8005"

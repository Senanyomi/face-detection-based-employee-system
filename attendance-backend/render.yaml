services:
  - type: web
    name: auth-service
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    startCommand: uvicorn auth_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: ENVIRONMENT
        value: production

